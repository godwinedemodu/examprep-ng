<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — CBT Examination</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell auto-submit-screen">
    <!-- Top Centered Title -->
    <header class="auto-submit-header">
      <h1 class="auto-submit-title">CBT Examination</h1>
    </header>

    <!-- Center Timer Ring & Notice Card -->
    <section class="auto-submit-body">
      <div class="timer-ring" role="timer" aria-live="polite">
        <span class="timer-ring-text" id="autoSubmitTimer">00:00:05</span>
      </div>

      <p class="timer-caption">Time Remaining</p>

      <div class="auto-submit-notice" role="status">
        <span class="notice-play-badge" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="8 5 19 12 8 19 8 5"></polygon>
          </svg>
        </span>
        <p class="notice-text">
          Your answers will be submitted automatically when the time runs out.
        </p>
      </div>
    </section>

    <!-- Bottom Exam Summary & Continue Button -->
    <footer class="auto-submit-footer">
      <div class="exam-meta-split">
        <span class="exam-meta-item">Question: 20</span>
        <span class="exam-meta-divider" aria-hidden="true"></span>
        <span class="exam-meta-item">20 Marks</span>
      </div>

      <a href="exam-result.html" class="btn btn-primary btn-pill">Continue Exam</a>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
