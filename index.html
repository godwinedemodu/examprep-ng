<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examprep NG - Onboarding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell onboarding-screen">
    <header class="onboarding-header">
      <div class="brand-logo">Examprep</div>
    </header>
        <!-- Main Hero Content -->
    <section class="onboarding-body">
      <h1 class="onboarding-title">
        Get ready for WAEC and JAMB with practice questions, mock exams and personalised learning progress.
      </h1>
      <!-- <p class="onboarding-subtitle">
        Practice past questions, take realistic CBT mock exams, and track your learning progress.
      </p> -->

      <!-- Hero Image / Illustration Placeholder -->
      <div class="hero-media">
        <img src="Asset/Image-1.png" alt="">
      </div>

      <!-- Bottom Actions -->
    <footer class="onboarding-footer">
      <a href="signup.html" class="btn btn-primary">Get Started</a>
      <p class="auth-redirect">
        Already have an account? <a href="login.html" class="link-bold">Log in</a>
      </p>
    </footer>

      <!-- Carousel Pagination Dots -->
      <div class="pagination-dots" role="tablist" aria-label="Onboarding slides">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </section>

  </main>
</body>
</html>
