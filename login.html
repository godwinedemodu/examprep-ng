<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Email Verified</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell auth-screen">
      <header class="auth-header">
        <div class="brand-logo">ExamPrep NG</div>
      </header>    
        <!-- Login Form Section -->
      <section class="auth-body">
        <h1 class="auth-title">Log in</h1>

        <form class="auth-form" action="select-exam.html" method="GET">
            <div class="form-group">
            <label for="username" class="sr-only">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                class="form-input"
                placeholder="Username"
                required
            />
            </div>

            <div class="form-group">
            <label for="password" class="sr-only">Password</label>
            <div class="password-wrapper">
                <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Password"
                required
                />
                <button
                type="button"
                class="toggle-password"
                aria-label="Toggle password visibility"
                >
                <!-- Eye Icon SVG -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                </button>
            </div>
            </div>

            <!-- Remember Me & Forgot Password Row -->
            <div class="form-options">
            <label class="checkbox-label">
                <input type="checkbox" name="remember" class="form-checkbox" />
                <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <p class="auth-redirect">
            Don't have an account? <a href="signup.html" class="link-bold">Sign up</a>
        </p>
      </section>
    </main>
</body>
</html>
