<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — CBT Mock Exam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell cbt-screen">
    <!-- Top Countdown Timer -->
    <header class="cbt-header">
      <div class="cbt-timer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15 14"></polyline>
        </svg>
        <span id="cbtTimer">00:59:32</span>
      </div>
    </header>

    <!-- Main CBT Question Body -->
    <section class="cbt-body">
      <div class="cbt-progress-section">
        <div class="cbt-count-row">
          <span class="quiz-count-label">Question 1 of 50</span>
          <div class="cbt-dots" aria-hidden="true">
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
            <span class="cbt-dot"></span>
          </div>
        </div>

        <div class="quiz-progress-track cbt-progress-track" role="progressbar" aria-valuenow="8" aria-valuemin="0" aria-valuemax="100">
          <div class="quiz-progress-fill" style="width: 8%;"></div>
        </div>
      </div>

      <!-- Question Prompt -->
      <h1 class="question-text">
        Which of the following is a prime number?
      </h1>

      <!-- Multiple Choice Options (A - D) -->
      <div class="options-list" role="radiogroup" aria-label="CBT Answer choices">
        <label class="option-card option-card-focused">
          <input type="radio" name="cbt_q1" value="A" class="option-radio sr-only" />
          <span class="option-badge">A</span>
          <span class="option-value">1</span>
        </label>

        <label class="option-card">
          <input type="radio" name="cbt_q1" value="B" class="option-radio sr-only" checked />
          <span class="option-badge">B</span>
          <span class="option-value">2</span>
        </label>

        <label class="option-card">
          <input type="radio" name="cbt_q1" value="C" class="option-radio sr-only" />
          <span class="option-badge">C</span>
          <span class="option-value">4</span>
        </label>

        <label class="option-card">
          <input type="radio" name="cbt_q1" value="D" class="option-radio sr-only" />
          <span class="option-badge">D</span>
          <span class="option-value">6</span>
        </label>
      </div>
    </section>

    <!-- Bottom Dual Action Buttons (Flag & Next) -->
    <footer class="cbt-footer-actions">
      <button type="button" class="btn cbt-flag-btn" id="cbtFlagBtn" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M5 3v18h2v-7h10l-2-4.5L17 5H7V3H5z"/>
        </svg>
        <span>Flag</span>
      </button>

      <a href="auto-submit.html" class="btn btn-primary cbt-next-btn">
        <span>Next</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
