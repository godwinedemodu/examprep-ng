<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Bookmarks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell bookmarks-empty-screen">
    <!-- Top Header: Back Arrow & Centered Title -->
    <header class="bookmarks-header">
      <a href="student-dashboard.html" class="back-btn" aria-label="Back to dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <h1 class="bookmarks-title">Bookmarks</h1>

      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <!-- Center Empty State Content -->
    <section class="bookmarks-empty-body">
      <!-- Reader with Open Book Illustration -->
      <div class="empty-reader-illustration" aria-hidden="true">
        <svg width="160" height="170" viewBox="0 0 160 170" fill="none">
          <!-- Yellow Head Circle -->
          <circle cx="80" cy="42" r="34" fill="#fdb849" />
          <!-- Left Page of Book -->
          <path d="M80 82L16 66L24 148L80 164V82Z" fill="#6878c9" />
          <!-- Right Page of Book -->
          <path d="M80 82L144 66L136 148L80 164V82Z" fill="#5969ba" />
          <!-- Left Yellow Hand -->
          <rect x="11" y="96" width="21" height="24" rx="10.5" fill="#fdb849" />
          <!-- Right Yellow Hand -->
          <rect x="128" y="96" width="21" height="24" rx="10.5" fill="#fdb849" />
        </svg>
      </div>

      <h2 class="empty-bookmarks-heading">No Bookmarks Yet</h2>
      <p class="empty-bookmarks-text">
        Save important question<br />
        And topics for quick access.
      </p>

      <a href="practice.html" class="btn btn-primary empty-browse-btn">Browse Questions</a>
    </section>

    <!-- Bottom Navigation Bar (Learn Active) -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="student-dashboard.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"></path>
        </svg>
        <span>Home</span>
      </a>

      <a href="syllabus.html" class="nav-item active" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="12" y2="16"></line>
        </svg>
        <span>Learn</span>
      </a>

      <a href="practice.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span>Practices</span>
      </a>

      <a href="profile.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </main>

  <script src="./script.js"></script>
</body>
</html>
