<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — You're All Set!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell setup-complete-screen">
    <section class="setup-complete-body">
      <!-- Large Green Circle Checkmark -->
      <div class="success-icon-green" aria-hidden="true">
        <svg width="136" height="136" viewBox="0 0 140 140" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="70" cy="70" r="60"></circle>
          <polyline points="44 72 62 90 96 52"></polyline>
        </svg>
      </div>

    <h1 class="setup-title">You're all set!</h1>
    <p class="setup-subtitle">
        Your learning journey starts here. Let's help you prepare confidently for your examinations.
    </p>

    <!-- Summary Section -->
    <div class="profile-summary">
        <h2 class="summary-heading">Your learning profile</h2>

        <div class="summary-list">
        <div class="summary-row">
            <span class="summary-label">Examinations</span>
            <span class="summary-value">WAEC, JAMB</span>
        </div>

        <div class="summary-row">
            <span class="summary-label">Subjects</span>
            <span class="summary-value">Mathematics,<br />Biology, Chemistry</span>
        </div>

        <div class="summary-row">
            <span class="summary-label">Study goals</span>
            <span class="summary-value">Improve my<br />understanding</span>
        </div>
        </div>
    </div>
    </section>

    <a href="dashboard.html" class="btn btn-primary btn-pill">Go to My Dashboard</a>
  </main>

  <script src="./script.js"></script>
</body>
</html>
