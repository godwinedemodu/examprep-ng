<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Review Answers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell review-screen">
    <!-- Top Header: Back Arrow & Title -->
    <header class="review-header">
      <a href="exam-result.html" class="back-btn" aria-label="Back to results">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <h1 class="review-title">Review Answers</h1>
    </header>

    <!-- Main Review Content -->
    <section class="review-body">
      <!-- Stacked Correct Answer Header + Explanation Card -->
      <div class="explanation-group">
        <div class="correct-banner" role="status">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#319645" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="8 12.5 10.8 15.3 16.5 9.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
          <span>Correct Answer: B</span>
        </div>

        <div class="explanation-card">
          <h2 class="explanation-heading">Explanation:</h2>
          <p class="explanation-text">
            A prime number is a number greater than 1 that has no divisors other than 1 and itself. 2 is the smallest prime number.
          </p>
        </div>
      </div>

      <!-- Topic Mastery Section -->
      <div class="mastery-section">
        <h2 class="mastery-heading">Topic Mastery</h2>

        <div class="mastery-card">
          <div class="mastery-top-row">
            <div class="mastery-subject-group">
              <span class="mastery-color-swatch" aria-hidden="true"></span>
              <span class="mastery-subject-name">Mathematics</span>
            </div>
            <span class="mastery-percent">85%</span>
          </div>

          <div class="mastery-track" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100">
            <div class="mastery-fill" style="width: 64%; margin-left: 11%;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bottom CTA Button -->
    <footer class="review-footer">
      <a href="dashboard.html" class="btn review-dashboard-btn">Back to Dashboard</a>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
