<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Practice Question</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell practice-screen">
    <!-- Top Header: Back Arrow & STEP 1 OF 10 -->
    <header class="step-header">
      <a href="student-dashboard.html" class="back-btn" aria-label="Back to dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <span class="step-label">STEP 1 OF 10</span>

      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <!-- Question Progress & Flag Row -->
    <section class="quiz-body">
      <div class="quiz-meta-row">
        <div class="quiz-progress-group">
          <span class="quiz-count-label">Question 1 of 10</span>
          <div class="quiz-progress-track" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">
            <div class="quiz-progress-fill" style="width: 32%;"></div>
          </div>
        </div>

        <button type="button" class="flag-btn" id="flagBtn" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M5 3v18h2v-7h10l-2-4.5L17 5H7V3H5z"/>
          </svg>
          <span>Flag</span>
        </button>
      </div>

      <!-- Question Prompt -->
      <h1 class="question-text">
        What is the value of x in<br />
        2x + 3 = 11?
      </h1>

      <!-- Multiple Choice Options (A - D) -->
      <div class="options-list" role="radiogroup" aria-label="Answer choices">
        <label class="option-card">
          <input type="radio" name="q1" value="A" class="option-radio sr-only" />
          <span class="option-badge">A</span>
          <span class="option-value">2</span>
        </label>

        <label class="option-card">
          <input type="radio" name="q1" value="B" class="option-radio sr-only" checked />
          <span class="option-badge">B</span>
          <span class="option-value">3</span>
        </label>

        <label class="option-card">
          <input type="radio" name="q1" value="C" class="option-radio sr-only" />
          <span class="option-badge">C</span>
          <span class="option-value">4</span>
        </label>

        <label class="option-card">
          <input type="radio" name="q1" value="D" class="option-radio sr-only" />
          <span class="option-badge">D</span>
          <span class="option-value">5</span>
        </label>
      </div>

      <!-- Instant Feedback Banner -->
      <div class="feedback-box feedback-correct" role="status">
        <div class="feedback-header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#16a34a" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="8 12.5 10.8 15.3 16.5 9.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
          <span>Correct!</span>
        </div>
        <div class="feedback-detail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#16a34a" aria-hidden="true">
            <path d="M12 22V12m0 0C12 7 7 5 3 6c0 4 2 7 9 6zm0 0c0-5 5-7 9-6 0 4-2 7-9 6z"/>
          </svg>
          <span>Well done. The correct answer is B</span>
        </div>
      </div>
    </section>

    <!-- Bottom Continue Pill Button -->
    <a href="cbt-mock.html" class="btn btn-primary btn-pill">
      <span>Continue</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </main>

  <script src="./script.js"></script>
</body>
</html>
