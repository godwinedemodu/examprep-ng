<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Forgot Password</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell forgot-password-screen">
    <!-- Top Header: Back Arrow & Title -->
    <header class="forgot-header">
      <a href="login.html" class="back-btn" aria-label="Back to login">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <h1 class="forgot-header-title">Forgot Password</h1>
    </header>

    <!-- Main Forgot Password Body -->
    <section class="forgot-body">
      <p class="forgot-instruction">
        Enter the email associated with your account and we will send a code to confirm your identity
      </p>

      <form class="forgot-form" action="verify-email.html" method="get">
        <div class="forgot-field-group">
          <label for="resetEmail" class="forgot-label">Email address</label>
          <input
            type="email"
            id="resetEmail"
            name="email"
            class="forgot-input"
            placeholder="Enter your email address"
            required
          />
        </div>

        <button type="submit" class="btn forgot-send-btn">Send Code</button>
      </form>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
