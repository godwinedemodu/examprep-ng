<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Choose Your Subjects</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell onboarding-step-screen">
    <!-- Top Back Arrow & Step 2 of 4 Progress -->
    <header class="step-header">
      <a href="select-exam.html" class="back-btn" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a> 
       <div class="step-indicator">
        <span class="step-label">STEP 2 OF 4</span>
        <div class="step-bar" aria-hidden="true">
            <span class="step-segment active"></span>
            <span class="step-segment active"></span>
            <span class="step-segment"></span>
            <span class="step-segment"></span>
        </div>
       </div>
       <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <!-- Subject Selection Form -->
    <form class="step-form" action="study-plan.html" method="GET">

    <div class="step-content">
        <h1 class="step-title">Choose your subjects</h1>
        <p class="step-subtitle">Select the subject you want to study.</p>

        <!-- Required Subjects Section -->
        <p class="section-kicker">REQUIRED SUBJECTS</p>
        <div class="required-subject-card">
        <input type="hidden" name="subjects" value="English Language" />
        <div class="subject-icon icon-blue" aria-hidden="true">
            <!-- Open Book Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2 4.5A2.5 2.5 0 0 1 4.5 2H11v18H4.5A2.5 2.5 0 0 0 2 22V4.5zm20 0A2.5 2.5 0 0 0 19.5 2H13v18h6.5a2.5 2.5 0 0 1 2.5 2V4.5z"/>
            </svg>
        </div>
        <div class="required-subject-info">
            <span class="required-subject-name">English Language</span>
            <span class="required-subject-note">Required for JAMB candidates</span>
        </div>
        <div class="lock-icon" aria-label="Required subject locked">
            <!-- Padlock Icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V7z"/>
            </svg>
        </div>
        </div>

        <!-- Other Subjects 2-Column Grid -->
        <p class="section-kicker">OTHER SUBJECTS</p>
        <div class="subjects-grid">
        <!-- Mathematics -->
        <label class="subject-card">
            <input type="checkbox" name="subjects" value="Mathematics" class="subject-checkbox sr-only" checked />
            <span class="subject-check-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            </span>
            <div class="subject-icon icon-blue" aria-hidden="true">
            <!-- Calculator Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M5 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm2 3v4h10V5H7zm0 6v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2zm-8 4v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/>
            </svg>
            </div>
            <span class="subject-label">Mathematics</span>
        </label>

        <!-- Biology -->
        <label class="subject-card">
            <input type="checkbox" name="subjects" value="Biology" class="subject-checkbox sr-only" checked />
            <span class="subject-check-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            </span>
            <div class="subject-icon icon-green" aria-hidden="true">
            <!-- Leaf/Sprout Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8Z"/>
            </svg>
            </div>
            <span class="subject-label">Biology</span>
        </label>

        <!-- Chemistry -->
        <label class="subject-card">
            <input type="checkbox" name="subjects" value="Chemistry" class="subject-checkbox sr-only" checked />
            <span class="subject-check-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            </span>
            <div class="subject-icon icon-blue" aria-hidden="true">
            <!-- Erlenmeyer Flask Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3h6"></path>
                <path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"></path>
                <path d="M7.5 14h9"></path>
            </svg>
            </div>
            <span class="subject-label">Chemistry</span>
        </label>

        <!-- Physics -->
        <label class="subject-card">
            <input type="checkbox" name="subjects" value="Physics" class="subject-checkbox sr-only" />
            <span class="subject-check-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            </span>
            <div class="subject-icon icon-amber" aria-hidden="true">
            <!-- Atom Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(30 12 12)"></ellipse>
                <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-30 12 12)"></ellipse>
                <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(90 12 12)"></ellipse>
            </svg>
            </div>
            <span class="subject-label">Physics</span>
        </label>

        <!-- Economics -->
        <label class="subject-card">
            <input type="checkbox" name="subjects" value="Economics" class="subject-checkbox sr-only" />
            <span class="subject-check-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            </span>
            <div class="subject-icon icon-green" aria-hidden="true">
            <!-- Bar Chart Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 20h16v2H2V4h2v16zm4-8h3v6H8v-6zm5-5h3v11h-3V7zm5 3h3v8h-3v-8z"/>
            </svg>
            </div>
            <span class="subject-label">Economics</span>
        </label>

        <!-- Government -->
        <label class="subject-card">
            <input type="checkbox" name="subjects" value="Government" class="subject-checkbox sr-only" />
            <span class="subject-check-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            </span>
            <div class="subject-icon icon-slate" aria-hidden="true">
            <!-- Government Building Icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 21V6l8-4 8 4v15h-6v-5h-4v5H4zm4-11v2h2v-2H8zm0 4v2h2v-2H8zm6-4v2h2v-2h-2zm0 4v2h2v-2h-2z"/>
            </svg>
            </div>
            <span class="subject-label">Government</span>
        </label>
        </div>
    </div>

    <!-- Selected Count & Continue CTA -->
    <div class="step-footer-actions">
        <p class="selected-count-text" id="subjectCountText">3 subject selected</p>
        <button type="submit" class="btn btn-primary btn-pill">Continue</button>
    </div>
    </form>
</main>

  <script src="./script.js"></script>
</body>
</html>
