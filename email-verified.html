<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Email Verified</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell status-screen">
    <section class="status-body">
        <!-- Thick Circle Checkmark Icon -->
        <div class="status-icon" aria-hidden="true">
            <svg width="140" height="140" viewBox="0 0 140 140" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="70" cy="70" r="60"></circle>
            <polyline points="44 72 62 90 96 52"></polyline>
            </svg>
        </div>
        <h1 class="status-title">Verified</h1>

        <a href="login.html" class="btn btn-primary btn-pill">
            <span>Continue</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </section>
  </main>
</body>
