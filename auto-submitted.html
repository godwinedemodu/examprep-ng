<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep NG — Auto-Submitted</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell auto-submitted-screen">
    <section class="auto-submitted-content" role="status" aria-live="polite">
      <!-- Solid Green Circle with Bold White Checkmark -->
      <div class="submitted-badge" aria-hidden="true">
        <svg width="200" height="200" viewBox="0 0 200 200" fill="none">
          <circle cx="100" cy="100" r="100" fill="#46cb72" />
          <path d="M56 104L84 132L146 70" stroke="#ffffff" stroke-width="24" stroke-linecap="butt" stroke-linejoin="miter" />
        </svg>
      </div>

      <h1 class="submitted-heading">Auto - Submitted!</h1>
      <p class="submitted-message">
        Your exam has been<br />
        successfully submitted.
      </p>

      <a href="exam-result.html" class="btn btn-primary submitted-cta-btn">View Results</a>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
