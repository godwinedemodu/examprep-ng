<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamPrep NG – Teacher Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="phone">
  <div class="status"><span>9:41 Tue Apr 1</span><span>100%</span></div>
  <div class="brand">🎓 ExamPrep NG</div>
  <div class="hero">
    <div class="cap-ico">🎓</div>
    <h1>ExamPrep <span>NG</span></h1>
    <p>Learn. Practice. Excel.</p>
  </div>
  <div class="login">
    <p class="lead">Access your teacher dashboard to manage students and assignments.</p>
    <label class="pill">✉️<input type="email" placeholder="Email Address" autocomplete="email"></label>
    <label class="pill">🔒<input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button type="button" id="eye" aria-label="Show password">👁</button></label>
    <div class="forgot">Forget Password?</div>
    <button class="btn-dark" type="button">Log In</button>
    <p class="signup">Don’t have an account? <a href="#">Sign Up</a></p>
  </div>
</section>
<script>
document.getElementById('eye').addEventListener('click', function () {
  var p = document.getElementById('pw');
  p.type = p.type === 'password' ? 'text' : 'password';
});
</script>
</body>
</html>
